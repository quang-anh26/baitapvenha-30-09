<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container"><a class="navbar-brand" href="/students">📚 Quản lý sinh viên</a></div>
</nav>

<div class="container" style="max-width: 640px;">
    <div class="card shadow-sm">
        <div class="card-header"><h5 class="mb-0">Chi tiết sinh viên</h5></div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-4">Mã sinh viên</dt><dd class="col-sm-8" th:text="${student.studentCode}"></dd>
                <dt class="col-sm-4">Họ tên</dt><dd class="col-sm-8" th:text="${student.fullName}"></dd>
                <dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${student.email}"></dd>
                <dt class="col-sm-4">Ngày sinh</dt><dd class="col-sm-8" th:text="${#temporals.format(student.dateOfBirth, 'dd/MM/yyyy')}"></dd>
                <dt class="col-sm-4">Giới tính</dt><dd class="col-sm-8" th:text="${student.gender}"></dd>
                <dt class="col-sm-4">Số điện thoại</dt><dd class="col-sm-8" th:text="${student.phone}"></dd>
                <dt class="col-sm-4">Địa chỉ</dt><dd class="col-sm-8" th:text="${student.address}"></dd>
                <dt class="col-sm-4">Lớp</dt><dd class="col-sm-8" th:text="${student.className}"></dd>
            </dl>
        </div>
        <div class="card-footer d-flex gap-2">
            <a class="btn btn-warning" th:href="@{/students/edit/{id}(id=${student.id})}">Sửa</a>
            <a class="btn btn-secondary" th:href="@{/students}">Quay lại</a>
        </div>
    </div>
</div>
</body>
</html>
