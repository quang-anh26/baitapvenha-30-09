<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container"><a class="navbar-brand" href="/products">🛒 Quản lý sản phẩm</a></div>
    </nav>

    <div class="container" style="max-width: 720px;">
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0">Thêm sản phẩm</h5>
            </div>
            <div class="card-body">
                <!-- BẮT BUỘC có enctype="multipart/form-data" -->
                <form th:action="@{/products/save}" th:object="${product}" method="post" enctype="multipart/form-data"
                    novalidate>

                    <div class="mb-3">
                        <label class="form-label">Tên sản phẩm *</label>
                        <input class="form-control" th:field="*{name}"
                            th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Giá *</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{price}"
                            th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{price}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Hình ảnh (có thể chọn nhiều ảnh .jpg / .png)</label>
                        <input type="file" name="files" multiple accept=".jpg,.jpeg,.png" class="form-control"
                            th:classappend="${imageError} ? 'is-invalid'">
                        <div class="invalid-feedback" th:text="${imageError}"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <a class="btn btn-secondary" th:href="@{/products}">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
