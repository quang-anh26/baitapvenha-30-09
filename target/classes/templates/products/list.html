<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container"><a class="navbar-brand" href="/products">🛒 Quản lý sản phẩm</a></div>
    </nav>

    <div class="container">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <div class="d-flex justify-content-end mb-3">
            <a class="btn btn-success" th:href="@{/products/new}">+ Thêm sản phẩm</a>
        </div>

        <div class="card shadow-sm">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Tên</th>
                        <th>Giá</th>
                        <th>Hình ảnh</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td th:text="${p.name}"></td>
                        <td th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                        <td>
                            <img th:each="img : ${p.images}" th:src="@{'/uploads/' + ${img.fileName}}" alt=""
                                class="me-1 rounded border" style="height:60px; width:60px; object-fit:cover;">
                            <span th:if="${#lists.isEmpty(p.images)}" class="text-muted">Chưa có ảnh</span>
                        </td>
                        <td class="text-end">
                            <form class="d-inline" th:action="@{/products/delete/{id}(id=${p.id})}" method="post"
                                onsubmit="return confirm('Bạn có chắc muốn xóa sản phẩm này?');">
                                <button class="btn btn-sm btn-danger" type="submit">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="4" class="text-center text-muted py-4">Không có dữ liệu</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
