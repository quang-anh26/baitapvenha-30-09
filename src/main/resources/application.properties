server.port=8080
spring.application.name=student-management

# ===== SQL Server (tao san database StudentDB truoc khi chay) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StudentDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=studentapp
spring.datasource.password=MatKhauCuaBan@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

