<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container"><a class="navbar-brand" href="/students">📚 Quản lý sinh viên</a></div>
</nav>

<div class="container">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between mb-3">
        <form class="d-flex" th:action="@{/students}" method="get">
            <input class="form-control me-2" type="text" name="keyword" th:value="${keyword}"
                   placeholder="Tìm theo mã hoặc họ tên...">
            <button class="btn btn-outline-primary" type="submit">Tìm</button>
        </form>
        <a class="btn btn-success" th:href="@{/students/new}">+ Thêm sinh viên</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã SV</th><th>Họ tên</th><th>Email</th><th>Ngày sinh</th>
                    <th>Giới tính</th><th>Lớp</th><th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${students}">
                    <td th:text="${s.studentCode}"></td>
                    <td th:text="${s.fullName}"></td>
                    <td th:text="${s.email}"></td>
                    <td th:text="${#temporals.format(s.dateOfBirth, 'dd/MM/yyyy')}"></td>
                    <td th:text="${s.gender}"></td>
                    <td th:text="${s.className}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-info text-white" th:href="@{/students/{id}(id=${s.id})}">Xem</a>
                        <a class="btn btn-sm btn-warning" th:href="@{/students/edit/{id}(id=${s.id})}">Sửa</a>
                        <form class="d-inline" th:action="@{/students/delete/{id}(id=${s.id})}" method="post"
                              onsubmit="return confirm('Bạn có chắc muốn xóa sinh viên này?');">
                            <button class="btn btn-sm btn-danger" type="submit">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="7" class="text-center text-muted py-4">Không có dữ liệu</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-muted">Tổng: <b th:text="${totalItems}"></b> sinh viên</span>
        <nav th:if="${totalPages > 1}">
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/students(page=${currentPage - 1}, keyword=${keyword})}">«</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/students(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/students(page=${currentPage + 1}, keyword=${keyword})}">»</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
