<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container"><a class="navbar-brand" href="/students">📚 Quản lý sinh viên</a></div>
</nav>

<div class="container" style="max-width: 720px;">
    <div class="card shadow-sm">
        <div class="card-header"><h5 class="mb-0" th:text="${title}"></h5></div>
        <div class="card-body">
            <form th:action="@{/students/save}" th:object="${student}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Mã sinh viên *</label>
                        <input class="form-control" th:field="*{studentCode}" placeholder="BIT240024"
                               pattern="B[A-Za-z]{2}(2[0-9]|30)[0-9]{4}" title="Mã gồm đúng 9 ký tự: B + 2 chữ cái + số từ 20 đến 30 + 4 chữ số, ví dụ BIT240024"
                               th:classappend="${#fields.hasErrors('studentCode')} ? 'is-invalid'">
                        <div id="studentCodeError" class="invalid-feedback" th:errors="*{studentCode}"></div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Họ tên *</label>
                        <input class="form-control" th:field="*{fullName}"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Số điện thoại</label>
                        <input class="form-control" th:field="*{phone}"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Ngày sinh *</label>
                        <input type="date" class="form-control" th:field="*{dateOfBirth}"
                               th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Giới tính *</label>
                        <select class="form-select" th:field="*{gender}"
                                th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid'">
                            <option value="">-- Chọn --</option>
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                            <option value="Khác">Khác</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{gender}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Lớp *</label>
                        <input class="form-control" th:field="*{className}"
                               th:classappend="${#fields.hasErrors('className')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{className}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Địa chỉ</label>
                        <input class="form-control" th:field="*{address}">
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Lưu</button>
                    <a class="btn btn-secondary" th:href="@{/students}">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    (() => {
        const form = document.querySelector('form');
        const input = document.getElementById('studentCode');
        const error = document.getElementById('studentCodeError');
        const format = /^B[A-Za-z]{2}(2[0-9]|30)[0-9]{4}$/;
        const message = 'Mã sinh viên không hợp lệ. Nhập đúng 9 ký tự: B + 2 chữ cái + số từ 20 đến 30 + 4 chữ số (ví dụ BIT240024).';
        let submitted = false;

        function validateStudentCode() {
            const valid = format.test(input.value);
            input.classList.toggle('is-invalid', !valid);
            error.textContent = valid ? '' : message;
            return valid;
        }

        input.addEventListener('input', () => {
            if (submitted) validateStudentCode();
        });
        form.addEventListener('submit', event => {
            submitted = true;
            if (!validateStudentCode()) {
                event.preventDefault();
                input.focus();
            }
        });
    })();
</script>
</body>
</html>
